version: "3.8"

services:
  proxy:
    image: nginx:alpine@sha256:c8497b180665e631ec92a5091125bec5b214f0e2b99409e30653a125b37557da
    volumes:
      - /root/tools_hub/hermes-agent-mission-control/hermy-hq-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.hermy-hq.rule=Host(`hermes.glowryia.com`)"
        - "traefik.http.routers.hermy-hq.entrypoints=websecure"
        - "traefik.http.routers.hermy-hq.tls=true"
        - "traefik.http.routers.hermy-hq.tls.certresolver=letsencrypt"
        - "traefik.http.routers.hermy-hq.service=hermy-hq"
        - "traefik.http.services.hermy-hq.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
    name: traefik-public
